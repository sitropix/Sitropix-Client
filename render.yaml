services:
  - type: web
    name: zohoportal-api
    env: node
    plan: free
    autoDeploy: true
    buildCommand: npm install --include=dev && npx prisma generate
    preDeployCommand: npx prisma db push
    startCommand: node server/src/index.mjs
    # Liveness: /api/health — database readiness: /api/health/ready
    healthCheckPath: /api/health
