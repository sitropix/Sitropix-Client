<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sitropix Customer Support — knowledge base, tickets, and billing in one place." />
    <title>Sitropix Support</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var key = "sitropix-portal-theme";
        var saved = localStorage.getItem(key);
        var theme =
          saved === "light" || saved === "dark"
            ? saved
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.classList.toggle("dark", theme === "dark");
        var path = location.pathname;
        if (path === "/admin" || path.indexOf("/admin/") === 0) {
          document.documentElement.setAttribute("data-admin-route", "true");
        }
      })();
    </script>
    <style>
      html {
        background-color: #fdf8f7;
      }
      html[data-admin-route="true"],
      html[data-admin-route="true"] body {
        background-color: #0a0a0a !important;
        background-image: none !important;
      }
      html[data-theme="dark"] {
        background-color: #121110;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background-color: inherit;
      }
      #root:empty::before {
        content: "";
        position: fixed;
        inset: 0;
        background-color: inherit;
      }
      #root:empty::after {
        content: "Loading…";
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          500 0.875rem/1.25 Inter,
          system-ui,
          sans-serif;
        color: #494740;
        letter-spacing: 0.02em;
      }
      html[data-theme="dark"] #root:empty::after {
        color: #c9c8c3;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
