<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15728C" />
    <meta name="description" content="Sitropix — a website that just works. Send a ticket, get it done. Managed websites for small businesses." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sitropix — A website that just works" />
    <meta property="og:description" content="Managed websites for small businesses. Send a ticket, get it done." />
    <meta property="og:site_name" content="Sitropix" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sitropix — A website that just works" />
    <meta name="twitter:description" content="Managed websites for small businesses. Send a ticket, get it done." />

    <title>Sitropix — A website that just works</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500&family=Open+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var key = "sitropix-portal-theme";
        var saved = localStorage.getItem(key);
        var theme =
          saved === "light" || saved === "dark"
            ? saved
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.classList.toggle("dark", theme === "dark");
      })();
    </script>
    <style>
      html {
        background-color: #fafaf8;
      }
      html[data-theme="dark"] {
        background-color: #0d0e10;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background-color: inherit;
      }
      #root:empty::before {
        content: "";
        position: fixed;
        inset: 0;
        background-color: inherit;
      }
      #root:empty::after {
        content: "Loading…";
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          500 0.875rem/1.25 "Inter Tight",
          Inter,
          system-ui,
          sans-serif;
        color: #6b6b62;
        letter-spacing: 0.02em;
      }
      html[data-theme="dark"] #root:empty::after {
        color: #c8c8c2;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
